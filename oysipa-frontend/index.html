<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/oyo_logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Oyo State Investment Promotion Agency - Investor Portal">
    <title>OYSIPA Investors Portal</title>
    <style>
      /* Splash Screen Styles */
      #splash-screen {
        position: fixed;
        inset: 0;
        background: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      .splash-logo {
        width: 120px;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }

      .splash-text {
        color: #333;
        font-family: 'Segoe UI', sans-serif;
        font-size: 1rem;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.9; }
      }
    </style>
  </head>

  <body>
    <!-- Splash Screen -->
    <div id="splash-screen">
      <img src="/oyo_logo.jpeg" alt="OYSIPA Logo" class="splash-logo" />
      <p class="splash-text"><b>Loading OYSIPA Investor Portal...</b></p>
    </div>

    <!-- React Root -->
    <div id="root" style="display: none;"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
